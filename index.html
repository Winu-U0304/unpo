/* ===== PIXEL SPRITE ENGINE ===== */
(()=>{
const PAL={k:'#14101c',w:'#f4f1e8',r:'#e0314b',y:'#ffd23f',o:'#f08a24',b:'#3b82f6',c:'#43d6e8',g:'#2fbf71',n:'#8a5a2b',p:'#f2b48a',s:'#9aa3b2',d:'#555d6e'};

const S={
'😠':'..yyyy..|.yyyyyy.|ykryyrky|ykkyykky|yyyyyyyy|yykkkkyy|.yyyyyy.|..yyyy..',
'🔫':'........|sssssss.|sddddddk|ssssssss|..sdd...|..sdd...|..dd....|........',
'🐛':'........|.gg..gg.|gggg.ggg|gkgggggg|gggggggg|.gggggg.|.g.gg.g.|........',
'🐶':dog('n').join('|'),'🐕':dog('o').join('|'),
'✊':'........|.pppppp.|pnpnpnpp|pppppppp|pppppppp|.pppppp.|..pppp..|........',
'✌':'.pp.pp..|.pp.pp..|.pp.pp..|.pppppp.|pppppppp|pppppppp|.pppppp.|..pppp..',
'✋':'.p.p.p..|.p.p.p.p|.ppppppp|pppppppp|pppppppp|.pppppp.|..pppp..|........',
'🚪':'.nnnnnn.|.nsnnsn.|.nnnnnn.|.nsnnsn.|.nnnnyn.|.nnnnyn.|.nnnnnn.|.nnnnnn.',
'💀':'.wwwwww.|wwwwwwww|wkkwwkkw|wkkwwkkw|wwwkkwww|.wwwwww.|.wkwkwk.|..wwww..',
'⛶':'wwww..ww|w......w|........|........|........|........|w......w|ww....ww'.replace(/wwww\.\.ww/,'ww....ww'),
'🐉':'g......g|gg.gg.gg|.gggggg.|gyrggyrg|gggggggg|.gwgwgw.|..gggg..|........',
'📍':'..rrrr..|.rrwrrr.|.rrrrrr.|..rrrr..|...rr...|...rr...|...k....|........',
'⚠':'...yy...|..yyyy..|..ykky..|.yykkyy.|.yyykyy.|yyyyyyyy|yyykkyyy|yyyyyyyy',
'🧰':'..ssss..|..s..s..|rrrrrrrr|rrrwwrrr|rrrrrrrr|rrrrrrrr|rrrrrrrr|kkkkkkkk',
'🎵':'...cccc.|...cc..c|...cc...|...cc...|.cccc...|ccccc...|.ccc....|........',
'⚱':'..nnnn..|...nn...|.nnnnnn.|nnonnonn|nnnnnnnn|nnnnnnnn|.nnnnnn.|..nnnn..',
'🔒':'..ssss..|.s....s.|.s....s.|yyyyyyyy|yyykkyyy|yyyykyyy|yyyyyyyy|yyyyyyyy',
'🗺':'wwwwwwww|wgggwbbw|wggwwbbw|wwwrwwww|wbbwwggw|wbbwgggw|wwwwwwww|nnnnnnnn',
'✓':'........|......gg|.....gg.|g...gg..|gg.gg...|.ggg....|..g.....|........',
'🧙':'..rrrr..|.rrrrrr.|..pppp..|.pkppkp.|..pppp..|.bbbbbb.|pbbbbbbp|.bb..bb.',
'\uE001':'...ww...|..wwww..|..bbbb..|.bbbbbb.|.bwbbbb.|.bwbbbb.|.bbbbbb.|.dddddd.',
'\uE002':'.......r|......rr|.....yy.|....yy..|...yy...|..yy....|.pn.....|nn......',
'\uE004':'........|..kkkk..|.kwwwwk.|kwwbbwwk|kwwbkwwk|.kwwwwk.|..kkkk..|........',
'\uE003':'........|........|.rrrwwww|rrrrwwww|rrrrwwww|.kkkkkkk|........|........'
};
const img={},cvs={};
for(const k in S){const rows=S[k].split('|'),c=document.createElement('canvas');c.width=8;c.height=8;const x=c.getContext('2d');
 rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1)}}));
 // 1px dark outline for readability
 const d=x.getImageData(0,0,8,8),o=document.createElement('canvas');o.width=o.height=10;const ox=o.getContext('2d');
 ox.fillStyle=PAL.k;[[0,1],[2,1],[1,0],[1,2]].forEach(([a,b])=>ox.drawImage(c,a,b));ox.globalCompositeOperation='source-atop';ox.fillRect(0,0,10,10);
 ox.globalCompositeOperation='source-over';ox.drawImage(c,1,1);cvs[k]=o;img[k]=o.toDataURL()}
window.PX={img,cvs};
const keys=Object.keys(S).filter(k=>k.charCodeAt(0)<0xE000&&k!=='🧙').map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
const RE=new RegExp('('+keys.join('|')+')\uFE0F?','g');
function conv(n){
 if(n.nodeType===3){const t=n.nodeValue;if(!RE.test(t)){RE.lastIndex=0;return}RE.lastIndex=0;
  const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(p.nodeName))return;

  while((m=RE.exec(t))){f.append(t.slice(last,m.index));const i=document.createElement('img');i.className='px';i.src=img[m[1]];i.alt=m[1];f.append(i);last=RE.lastIndex}
  f.append(t.slice(last));RE.lastIndex=0;p.replaceChild(f,n)}
 else if(n.nodeType===1&&!/^(SCRIPT|STYLE|CANVAS)$/.test(n.nodeName)){[...n.childNodes].forEach(conv)}}
new MutationObserver(ms=>ms.forEach(m=>{m.type==='characterData'?conv(m.target):m.addedNodes.forEach(conv)})).observe(document.body,{childList:true,subtree:true,characterData:true});

CanvasRenderingContext2D.prototype.fillText=function(t,x,y,mw){
 const k=String(t).replace('\uFE0F','');const px=parseFloat((this.font.match(/([\d.]+)px/)||[0,16])[1]);

const raf=window.requestAnimationFrame.bind(window);

})();

<script>
let currentStage = 1;
let deathCount = 0;
let audioCtx = null;
let judging = false;      // 判定中の二重入力防止
let stageToken = 0;       // ステージ切替時に古いタイマーを無効化
let outerHandler = null;  // ステージ15用の背景クリック

const stageArea = document.getElementById('stage-area');
const judge = document.getElementById('judge');
const chatArea = document.getElementById('chat-area');

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'correct') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, now);
    osc.frequency.setValueAtTime(880, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'miss') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(80, now + 0.4);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.4);
  } else if (type === 'tettele') {
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, now + index * 0.12);

          p.style.setProperty('--y', (120 + Math.random() * 40) + 'px');
          sBox.appendChild(p);
          setTimeout(() => p.remove(), 1000);
        }
        disBtn.style.display = 'none';
        sPile.style.display = 'block';
        setTimeout(() => { sPile.style.height = '30px'; }, 100);
      });
      sPile.addEventListener('click', () => triggerJudge(true, nextStage));
      break;
    }

    case 13:
      stageArea.innerHTML = `${updateTitle(13)}<h2>ポーズメニュー画面</h2>
        <div style="background:rgba(255,255,255,0.1); padding:20px; border-radius:8px; margin:20px;" id="pause-screen">
          <p style="color:#ccc; margin-top:0;">一時中断中</p>
          <button class="btn" id="restart-btn" style="background:#ff3366;">最初から再開する</button>
        </div>`;
      document.getElementById('restart-btn').addEventListener('click', () => {
        triggerJudge(false, () => {
          currentStage = 1;
          showGameOver('最初からやり直し死', '「最初から再開する」を文字通り実行してステージ1に戻してあげました。');
        });
      });
      document.getElementById('pause-screen').addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON') triggerJudge(true, nextStage);
      });
      break;

    case 14: {
      stageArea.innerHTML = `${updateTitle(14)}<h2>画面を10回クリックせよ</h2>
        <div style="font-size:32px; font-weight:bold; margin:20px;" id="click-count">0 / 10</div>
        <button class="btn" id="count-btn">クリック！</button>
        <div class="fake-popup" id="alert-pop">
          <div><b style="color:#ffcc00; font-size:12px;">⚠️ システム警告</b><div style="font-size:11px; color:#ccc;">バッテリー残量が少なくなっています (1%)</div></div>
          <div style="background:#444; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;" id="close-pop">閉じる</div>
        </div>`;
      let clickNum = 0;
      const cBtn = document.getElementById('count-btn');
      const aPop = document.getElementById('alert-pop');
      setTimeout(() => {
        if (token === stageToken && aPop) { aPop.style.top = '10px'; playSound('miss'); }
      }, 1200);
      document.getElementById('close-pop').addEventListener('click', (e) => {
        e.stopPropagation();
        triggerJudge(false, () => showGameOver('広告トラップ死', '偽のポップアップ通知に引っかかりましたねｗ'));
      });
      cBtn.addEventListener('click', () => {
        if (judging) return;
        playSound('bgm');
        clickNum++;
        document.getElementById('click-count').innerText = `${clickNum} / 10`;
        if (clickNum >= 10) triggerJudge(true, nextStage);
      });
      break;
    }

    case 15:
      stageArea.innerHTML = `${updateTitle(15)}<h2>今度こそ本当に最終選択</h2>
        <button class="btn" id="true-clear" style="background:green;">ゲームクリア</button>
        <button class="btn" onclick="triggerJudge(false, () => showGameOver('自爆死', '最後の最後で自爆を選ぶその思い切りの良さは嫌いじゃないよｗ'))" style="background:red;">自爆</button>`;
      document.getElementById('true-clear').addEventListener('click', () => {
        triggerJudge(false, () => showGameOver('騙され死（正解は画面外のどこか…？）', 'クリアボタンは罠！正解は画面の外（背景）のクリックでした！'));
      });
      // 背景（ゲーム画面・スマホ以外）のクリックが正解
      outerHandler = (e) => {
        const inGame = document.getElementById('game-container').contains(e.target);
        const inPhone = document.getElementById('phone-container').contains(e.target);
        if (!inGame && !inPhone) {
          document.removeEventListener('click', outerHandler);
          outerHandler = null;
          triggerJudge(true, nextStage);
        }
      };
      setTimeout(() => { if (token === stageToken && outerHandler) document.addEventListener('click', outerHandler); }, 0);
      break;

    default:
      if (EXTRA[stageNum]) EXTRA[stageNum](token);
  }

  const footer = document.createElement('div');
  footer.style = 'margin-top:20px; font-size:12px; color:#e9fff0; cursor:pointer; text-decoration:underline;';
  footer.innerText = '2も実装計画しております。';
  footer.onclick = () => { playSound('miss'); alert('嘘でした！ｗｗ'); };
  stageArea.appendChild(footer);
}

showTitle();
</script>
<script>
/* title / map decorations */
(()=>{const I=k=>`<img class="px" src="${PX.img[k]}" alt="">`;
const t0=showTitle;showTitle=function(){t0();const d=document.createElement('div');d.className='px-deco';d.innerHTML=I('🧙')+I('🐉')+I('💀')+I('🚪');stageArea.appendChild(d)};
const m0=showMap;showMap=function(){m0();const box=document.getElementById('map-box');if(!box)return;const n=box.querySelector('.node.open')||box.querySelector('.node');
 if(n){const h=document.createElement('img');h.id='px-hero';h.src=PX.img['🧙'];h.style.left=(parseInt(n.style.left)+2)+'px';h.style.top=(parseInt(n.style.top)-26)+'px';box.appendChild(h)}};
showTitle();})();

/* ===== TIME ATTACK ===== */
let taMode=false,taStart=0,taPenalty=0,taSplits=[],taIv=null,taDeath0=0;
const fmt=ms=>{ms=Math.max(0,ms);return Math.floor(ms/60000)+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0')+'.'+String(Math.floor(ms%1000/10)).padStart(2,'0');};
const hud=document.createElement('div');hud.id='ta-hud';document.body.appendChild(hud);
const taTick=()=>{hud.style.display='block';hud.innerHTML=`TIME ${fmt(performance.now()-taStart+taPenalty)}<small>STAGE ${currentStage}/${TOTAL}${taPenalty?'　+'+taPenalty/1000+'s':''}</small>`;};
const taOff=()=>{taMode=false;clearInterval(taIv);hud.style.display='none';};
function startTA(){initAudio();taMode=true;taPenalty=0;taSplits=[];taDeath0=deathCount;taStart=performance.now();clearInterval(taIv);taIv=setInterval(taTick,50);taTick();currentStage=1;loadStage(1);}
function quitTA(){taOff();showTitle();}
function taFinish(){const total=performance.now()-taStart+taPenalty;taOff();resetStage();let best=null;try{best=+localStorage.getItem('kichikuBest')||null;}catch(e){}
  const rec=!best||total<best;if(rec){try{localStorage.setItem('kichikuBest',String(Math.round(total)));}catch(e){}}
  const rows=taSplits.map((t,i)=>`<div>S${i+1} ${NAMES[i+1]}　${fmt(t-(i?taSplits[i-1]:0))}</div>`).join('');
  stageArea.innerHTML=`<h2>タイムアタック完走！</h2><div style="font-size:40px;font-weight:bold;color:#fff3a0">${fmt(total)}</div>${rec?'<div>NEW RECORD!</div>':`<div>ベスト ${fmt(best)}</div>`}<div>死亡 ${deathCount-taDeath0} 回${taPenalty?`　ペナルティ +${taPenalty/1000}秒`:''}</div><div style="max-height:150px;overflow:auto;font-size:12px;text-align:left;margin:8px 0;width:300px;border:3px solid #000;padding:6px;background:#1d6b3a">${rows}</div><button class="btn" onclick="startTA()">もう一度</button><button class="btn" onclick="showTitle()">タイトルへ</button>`;
  playSound('tettele');}
const ns0=nextStage;nextStage=function(){if(!taMode)return ns0();taSplits.push(performance.now()-taStart+taPenalty);if(currentStage>=TOTAL)return taFinish();currentStage++;loadStage(currentStage);};
const go0=showGameOver;showGameOver=function(a,b){go0(a,b);if(!taMode)return;const bs=document.querySelectorAll('.overlay button');if(bs[1]){bs[1].textContent='中止してタイトルへ';bs[1].onclick=quitTA;}};
const sm0=showMap;showMap=function(){if(taMode){if(!confirm('タイムアタックを中止してマップへ戻りますか？'))return;taOff();}sm0();};
const st0=showTitle;showTitle=function(){if(taMode)taOff();st0();const b=stageArea.querySelectorAll('.btn')[1];if(b){let best=null;try{best=+localStorage.getItem('kichikuBest')||null;}catch(e){}
  b.insertAdjacentHTML('afterend','<br><button class="btn" onclick="startTA()">タイムアタック</button>'+(best?`<div style="font-size:13px">ベスト ${fmt(best)}</div>`:''));}};
showTitle();
(()=>{const fit=()=>{const w=Math.min(window.innerWidth,screen.width||9999),g=document.getElementById('game-container'),p=document.getElementById('phone-container');
 g.style.zoom=Math.min(1,(w-44)/516);p.style.zoom=Math.min(1,(w-44)/304);};fit();addEventListener('resize',fit);addEventListener('orientationchange',fit);})();
</script>
</body>
