<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超・初見殺し鬼畜ゲーム 極</title>
<style>
body { background-color: #111; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: row; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; user-select: none; gap: 40px; }
#game-container { background-color: #222; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); text-align: center; width: 450px; min-height: 400px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
#phone-container { width: 280px; height: 460px; background-color: #7493a1; border: 12px solid #333; border-radius: 24px; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; position: relative; overflow: hidden; }
#phone-header { background-color: #2c3e50; color: white; padding: 10px; text-align: center; font-size: 14px; font-weight: bold; border-bottom: 1px solid #222; }
#chat-area { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.4; word-break: break-all; position: relative; animation: popMsg 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
@keyframes popMsg { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.msg-left { background-color: white; color: black; align-self: flex-start; border-top-left-radius: 2px; }
.msg-left::before { content: ""; position: absolute; left: -6px; top: 0; border-width: 5px 6px 5px 0; border-style: solid; border-color: transparent white transparent transparent; }
h2 { margin-top: 0; font-size: 24px; color: #ff3366; }
.stage-title { font-size: 14px; color: #aaa; margin-bottom: 5px; }
#death-counter-display { font-size: 14px; color: #ff3366; font-weight: bold; margin-bottom: 15px; }
.btn { background-color: #333; color: white; border: 2px solid #555; padding: 12px 24px; margin: 10px; font-size: 18px; cursor: pointer; border-radius: 5px; transition: background 0.2s, transform 0.1s; min-width: 150px; }
.btn:hover { background-color: #444; }
.btn:active { transform: scale(0.98); }
.word-container { font-size: 48px; font-weight: bold; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; gap: 2px; }
.shi-char { display: inline-block; transition: transform 3.0s ease-in-out, color 3.0s ease-in-out; transform-origin: left center; }
.ya-char { position: absolute; left: 300px; opacity: 0; color: #3399ff; transition: left 3.0s ease-in-out, opacity 3.0s ease-in-out; white-space: nowrap; }
.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 0, 50, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; z-index: 100; animation: bloodSplatter 0.4s ease-out; }
@keyframes bloodSplatter { 0% { transform: scale(0.5); opacity: 0; background-color: #fff; } 50% { background-color: #ff0000; } 100% { transform: scale(1); opacity: 1; } }
.overlay h1 { font-size: 56px; margin: 0; text-shadow: 3px 3px #000; letter-spacing: 4px; animation: shake 0.2s infinite; }
@keyframes shake { 0% { transform: translate(2px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(0px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(2px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(2px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
.reason { font-size: 36px; font-weight: bold; margin: 20px 0; text-shadow: 2px 2px #000; white-space: nowrap; }
.judge-mark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 150px; font-weight: bold; z-index: 200; pointer-events: none; }
@keyframes popMark { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.hidden-trigger { cursor: pointer; }
.toge-btn { position: relative; }
.toge { position: absolute; top: -15px; left: 45%; font-size: 24px; display: none; color: #ff3366; }
.falling-object { position: absolute; top: -40px; font-size: 40px; animation: fallDown 1.5s linear forwards; }
@keyframes fallDown { 0% { top: -40px; } 100% { top: 200px; } }
.sand-particle { position: absolute; background: #ffcc66; width: 4px; height: 4px; border-radius: 50%; animation: particleFall 1.0s ease-in forwards; }
@keyframes particleFall { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(var(--x), var(--y)); opacity: 0.8; } }
#sand-pile { position: absolute; bottom: 40px; left: 25%; width: 50%; height: 0px; background: #ffcc66; border-radius: 50% 50% 0 0; transition: height 0.5s ease-out; cursor: pointer; display: none; }
.fake-popup { position: absolute; top: -60px; left: 5%; width: 90%; background: rgba(30,30,30,0.95); border: 1px solid #444; border-radius: 12px; padding: 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 50; transition: top 0.3s ease-out; }
input { -webkit-user-select: text; user-select: text; }
.title-logo { font-size: 44px; font-weight: bold; line-height: 1.15; color: #ff3366; text-shadow: 3px 3px #000; animation: bob 2s ease-in-out infinite; margin: 20px 0 10px; }
.title-logo span { color: #ffcc00; font-size: 60px; margin-left: 8px; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.title-sub { color: #aaa; margin-bottom: 24px; }
#map-box { position: relative; width: 390px; }
.node { position: absolute; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; border: 3px solid #555; background: #2a2a2a; color: #777; box-sizing: border-box; }
.node.open { background: #ff3366; border-color: #fff; color: #fff; cursor: pointer; animation: pulse 1.4s infinite; }
.node.done { background: #0a7; border-color: #0fc; color: #fff; cursor: pointer; }
.node.lock { font-size: 13px; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
#map-cap { height: 20px; font-size: 13px; color: #ccc; margin: 6px 0; }
.maplink { cursor: pointer; color: #6cf; text-decoration: underline; }
.gb { min-width: 0; padding: 8px 16px; font-size: 16px; margin: 4px; touch-action: none; }
</style>
</head>
<body>
<div id="game-container">
  <div id="stage-area"></div>
  <div id="judge" class="judge-mark"></div>
</div>
<div id="phone-container">
  <div id="phone-header">通知窓</div>
  <div id="chat-area"></div>
</div>

<script>
let currentStage = 1;
let deathCount = 0;
let audioCtx = null;
let judging = false;      // 判定中の二重入力防止
let stageToken = 0;       // ステージ切替時に古いタイマーを無効化
let outerHandler = null;  // ステージ15用の背景クリック

const stageArea = document.getElementById('stage-area');
const judge = document.getElementById('judge');
const chatArea = document.getElementById('chat-area');

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'correct') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, now);
    osc.frequency.setValueAtTime(880, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'miss') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(80, now + 0.4);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.4);
  } else if (type === 'tettele') {
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, now + index * 0.12);
      gain.gain.setValueAtTime(0.15, now + index * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.12 + 0.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + index * 0.12); osc.stop(now + index * 0.12 + 0.2);
    });
  } else if (type === 'bgm') {
    const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 349.23, 329.63, 293.66];
    notes.forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + index * 0.25);
      gain.gain.setValueAtTime(0.05, now + index * 0.25);
      gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.25 + 0.22);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + index * 0.25); osc.stop(now + index * 0.25 + 0.25);
    });
  }
}

function sendInsult(text) {
  const msg = document.createElement('div');
  msg.className = 'msg msg-left';
  msg.innerText = text;
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showGameOver(deathType, comment) {
  deathCount++;
  playSound('miss');
  sendInsult(comment);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<h1>GAME OVER</h1><div class="reason">${deathType}</div><button class="btn" onclick="restartStage()">このステージをやり直す</button><button class="btn" style="font-size:13px;min-width:0;padding:6px 12px" onclick="showMap()">マップへ</button>`;
  document.getElementById('game-container').appendChild(overlay);
}

function triggerJudge(isCorrect, callback) {
  if (judging) return;
  judging = true;
  judge.style.animation = 'none';
  judge.offsetHeight;
  if (isCorrect) {
    judge.innerText = '〇';
    judge.style.color = '#00ffcc';
    playSound('correct');
  } else {
    judge.innerText = '×';
    judge.style.color = '#ff3366';
  }
  judge.style.animation = 'popMark 0.4s forwards';
  setTimeout(() => {
    judge.style.animation = 'none';
    judge.style.transform = 'translate(-50%, -50%) scale(0)';
    callback();
  }, 600);
}

function restartStage() { loadStage(currentStage); }

const TOTAL = 27;
const NAMES = ['','ハ池','安全な道','ゴール','読み込み中','1+1','音量警告','宝箱','爆弾解除','利用規約','最終…？','音ゲー','進むボタン','ポーズ','10クリック','真・最終','3D視線','押すな','間違い探し','5秒ぴったり','パスワード','ジャンケン','逆スライダー','暗闇','動くな','消える選択肢','水桶','ラスボス'];
let cleared = {};
let cleanups = [];
try { cleared = JSON.parse(localStorage.getItem('kichikuCleared') || '{}'); } catch (e) {}
const saveProgress = () => { try { localStorage.setItem('kichikuCleared', JSON.stringify(cleared)); } catch (e) {} };
const $ = id => document.getElementById(id);
const win = () => triggerJudge(true, nextStage);
const lose = (t, c) => triggerJudge(false, () => showGameOver(t, c));

function resetStage() {
  stageToken++; judging = false;
  cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = [];
  if (outerHandler) { document.removeEventListener('click', outerHandler); outerHandler = null; }
  const o = document.querySelector('.overlay'); if (o) o.remove();
}
function showTitle() {
  resetStage();
  const has = Object.keys(cleared).length > 0;
  stageArea.innerHTML = `<div class="title-logo">超・初見殺し<br>鬼畜ゲーム<span>極</span></div><div class="title-sub">〜 全${TOTAL}コース制覇の旅 〜</div>
    <button class="btn" onclick="initAudio();startStage(1)">初めから</button><br>
    <button class="btn" onclick="initAudio();showMap()">マップ</button>
    ${has ? '<br><button class="btn" style="font-size:13px;min-width:0;padding:6px 12px" onclick="if(confirm(\'セーブデータを消しますか？（クリア記録が全て消えます）\')){cleared={};deathCount=0;saveProgress();showTitle();}">データ消去</button>' : ''}`;
}
function showMap() {
  resetStage();
  const cols = 6, h = Math.ceil(TOTAL / cols) * 56 + 16;
  const pos = i => { const n = i - 1, r = Math.floor(n / cols); let c = n % cols; if (r % 2) c = cols - 1 - c; return [32 + c * 65, 30 + r * 56]; };
  let pts = [], nodes = '';
  for (let i = 1; i <= TOTAL; i++) {
    const [x, y] = pos(i); pts.push(x + ',' + y);
    const open = i === 1 || cleared[i - 1] || cleared[i];
    const cls = cleared[i] ? 'done' : (open ? 'open' : 'lock');
    nodes += `<div class="node ${cls}" style="left:${x - 18}px;top:${y - 18}px" ${open ? `onclick="startStage(${i})"` : ''} onmouseover="mapCap(${i},${!!open})">${cleared[i] ? '✓' : (open ? i : '🔒')}</div>`;
  }
  stageArea.innerHTML = `<h2>🗺 鬼畜ワールドマップ</h2><div id="death-counter-display">DEATH: ${deathCount}　CLEAR: ${Object.keys(cleared).length}/${TOTAL}</div>
    <div id="map-box" style="height:${h}px"><svg width="390" height="${h}" style="position:absolute;left:0;top:0"><polyline points="${pts.join(' ')}" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="8 6" stroke-linejoin="round"/></svg>${nodes}</div>
    <div id="map-cap">コースを選んでください</div><button class="btn" style="font-size:13px;padding:6px 12px;min-width:0" onclick="showTitle()">タイトルへ</button>`;
}
function mapCap(i, open) { const c = $('map-cap'); if (c) c.innerText = open ? `ステージ${i}：${NAMES[i]}` : '？？？（前のコースをクリアで解放）'; }
function startStage(i) { initAudio(); currentStage = i; loadStage(i); }


function nextStage() {
  cleared[currentStage] = true; saveProgress();
  if (Object.keys(cleared).length >= TOTAL) showClear(); else showMap();
}
function showClear() {
  stageToken++; judging = false;
  if (outerHandler) { document.removeEventListener('click', outerHandler); outerHandler = null; }
  stageArea.innerHTML = `<h1 style="color: #00ffcc; font-size: 36px;">全${TOTAL}コース制覇！</h1><p style="font-size:18px;">おわり<br>END</p><div style="font-size:24px; color:#ff3366; font-weight:bold; margin:20px 0;">総死亡回数: ${deathCount} 回</div><button class="btn" onclick="showMap()">マップへ</button><button class="btn" onclick="deathCount=0; cleared={}; saveProgress(); showTitle();">最初から遊ぶ</button>`;
  playSound('tettele');
}
function updateTitle(n) {
  return `<div class="stage-title">ステージ ${n} / ${TOTAL}　<span class="maplink" onclick="showMap()">🗺マップ</span></div><div id="death-counter-display">DEATH: ${deathCount}</div>`;
}
const EXTRA = {};


EXTRA[16] = (token) => {
  const CM = [['ペットボトル', 'bottle'], ['鉛筆', 'pencil'], ['消しゴム', 'eraser'], ['虫', 'bug']];
  const cmd = CM[Math.floor(Math.random() * 4)];
  stageArea.innerHTML = `${updateTitle(16)}<h2>3D：「${cmd[0]}をとって」</h2>
    <canvas id="c3d" width="390" height="250" style="background:#10141c;border-radius:6px;cursor:crosshair"></canvas>
    <div style="font-size:12px;color:#aaa;margin-top:6px">マウスで目線(矢印)を狙って <b>左クリック</b> で発射！机の下も狙えます。外すと撃たれます</div>`;
  const cv = $('c3d'), g = cv.getContext('2d'), W = 390, H = 250, F = 270;
  const FL = -2.6, DZ = 9.5, LOOK0 = [0, -.2, 1];
  const OBJ = {
    bottle: { n: 'ペットボトル', cx: 0.8, cz: 9.0, y: 0, bx: .45, bz: .45, h: 1.57 },
    pencil: { n: '鉛筆', cx: -1.8, cz: 8.6, y: FL, bx: 1.1, bz: .12, h: .15 },
    eraser: { n: '消しゴム', cx: 1.9, cz: 9.2, y: FL, bx: .5, bz: .35, h: .35 },
    bug: { n: '虫', cx: 0.0, cz: 9.9, y: FL, bx: .5, bz: .5, h: .5 }
  };
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], nrm = a => mul(a, 1 / (Math.hypot(...a) || 1));
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const EYE = [0, 2.4, 0], V0 = 8.5, GR = 9;
  let view, cam = EYE.slice(), look = add(EYE, LOOK0);
  const setView = (c, t) => { const f = nrm(sub(t, c)), r = nrm([f[2], 0, -f[0]]); view = { c, f, r, u: cross(f, r) }; };
  const pj = p => { const q = sub(p, view.c), z = dot(q, view.f); return [W / 2 + F * dot(q, view.r) / z, H / 2 - F * dot(q, view.u) / z, z]; };
  const rgb = (c, k) => `rgb(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0})`;
  const prism = (cx, y0, cz, rx, rz, h, n, c, rot) => {
    const o = [], q = [];
    for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; q.push([cx + Math.cos(a) * rx, cz + Math.sin(a) * rz, a]); }
    for (let i = 0; i < n; i++) { const a = q[i], b = q[(i + 1) % n]; o.push({ pts: [[a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y0 + h, b[1]], [a[0], y0 + h, a[1]]], col: rgb(c, .55 + .4 * Math.abs(Math.sin(a[2] + Math.PI / n))) }); }
    o.push({ pts: q.map(a => [a[0], y0 + h, a[1]]), col: rgb(c, 1.15) });
    return o;
  };
  const box = (cx, y0, cz, bx, bz, h, c) => prism(cx, y0, cz, bx * 1.4142, bz * 1.4142, h, 4, c, Math.PI / 4);
  const drawFaces = faces => {
    faces.map(f => { const p = f.pts.map(pj); return { p, col: f.col, z: p.reduce((a, q) => a + q[2], 0) / p.length }; })
      .filter(f => f.p.every(q => q[2] > .2)).sort((a, b) => b.z - a.z)
      .forEach(f => { g.fillStyle = f.col; g.beginPath(); f.p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fill(); g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1; g.stroke(); });
  };
  const ln = (a, b, col, w) => { const p = pj(a), q = pj(b); if (p[2] < .2 || q[2] < .2) return; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); };
  const txt = (s, p, size, col) => { const q = pj(p); if (q[2] < .3) return; g.font = `${size * F / q[2]}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col || '#fff'; g.fillText(s, q[0], q[1]); };
  const dot3 = (p, r, col) => { const q = pj(p); if (q[2] < .3) return; g.fillStyle = col; g.beginPath(); g.arc(q[0], q[1], Math.max(1.5, r * F / q[2]), 0, 7); g.fill(); };
  const arrow = (tail, d, len) => {
    const tip = add(tail, mul(d, len)), s = F / Math.max(.3, pj(tail)[2]), w = Math.max(2, .09 * s);
    ln(tail, tip, '#ffcc00', w);
    const up = Math.abs(d[1]) > .95 ? [1, 0, 0] : [0, 1, 0], u = nrm(cross(up, d)), v = cross(d, u), b = sub(tip, mul(d, .35));
    [[u, 1], [u, -1], [v, 1], [v, -1]].forEach(([e, k]) => ln(tip, add(b, mul(e, k * .2)), '#ffcc00', w));
  };
  const inDesk = p => Math.abs(p[0]) < 4.5 && Math.abs(p[2] - DZ) < 2.5;
  const step = (p, v, dt) => {
    const py = p[1];
    v[1] -= GR * dt; p[0] += v[0] * dt; p[1] += v[1] * dt; p[2] += v[2] * dt;
    if (inDesk(p)) {
      if (py >= 0 && p[1] < 0) {
        p[1] = 0; const hit = Math.abs(v[1]) > 1; v[1] = hit ? -v[1] * .6 : 0;
        if (hit) { v[0] *= .85; v[2] *= .85; } else { v[0] *= .995; v[2] *= .995; } return hit ? 'bounce' : '';
      }
      if (py <= -.3 && p[1] > -.3) { p[1] = -.3; v[1] = -Math.abs(v[1]) * .4; return 'bounce'; }
    }

  footer.style = 'margin-top:20px; font-size:12px; color:#555; cursor:pointer; text-decoration:underline;';
  footer.innerText = '2も実装計画しております。';
  footer.onclick = () => { playSound('miss'); alert('嘘でした！ｗｗ'); };
  stageArea.appendChild(footer);
}

showTitle();
</script>
